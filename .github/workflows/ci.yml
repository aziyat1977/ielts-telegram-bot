name: ci
on:
  push:
    branches: [ "main", "sprint2/**" ]
  pull_request:
    branches: [ "main" ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: node -v
      - name: Install (no deps)
        run: echo "No external dependencies"
      - name: Run baseline engines
        run: node scripts/run_all.mjs | tee run_output.json
      - name: Compute QWK
        run: node scripts/eval_qwk.mjs | tee qwk_output.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-baseline-artifacts
          path: |
            run_output.json
            qwk_output.json
            tests/sample_pred.json
            tests/sample_gold.json
