name: sprint3-ci
on:
  push:
    branches: [ "main", "sprint3/**" ]
  pull_request:
    branches: [ "main" ]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal deps
        run: python -m pip install --upgrade pip
      - name: Run offline eval
        run: python notebooks/run_offline_eval.py | tee sprint3_qwk_log.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-offline-eval
          path: |
            notebooks/outputs/sprint3_qwk.json
            sprint3_qwk_log.json
