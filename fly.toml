app = "ieltsbot-v2-1761"
primary_region = "fra"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"

[processes]
  http = "uvicorn __guard_http:app --host 0.0.0.0 --port ${PORT:-8080}"
  bot  = "python main.py"
[[services]]
  processes = ["http"]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls","http"]
    port = 443

  [[services.http_checks]]
    path         = "/health"
    method       = "get"
    protocol     = "http"
    grace_period = "10s"
    interval     = "15s"
    timeout      = "2s"

[http_service.checks]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[services.http_checks]]

[[http_service.checks]]
  grace_period = "10s"
  interval     = "30s"
  timeout      = "5s"
  method       = "GET"
  path         = "/health"
  [http_service.checks.headers]
    X-Forwarded-Proto = "https"
